[package]
name = "best-driver"
version = "0.1.6"
edition = "2021"
description = "High-performance undetected Chromium CDP driver written in Rust with Python bindings"
readme = "README.md"
license = "MIT"
repository = "https://github.com/real-coder-xD/best-driver"

[lib]
name = "best_driver"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = "0.30"
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
which = "7.0"
tempfile = "3"
base64 = "0.22"
